apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-vllm-pd-control-pilot-qwen36-27b
  namespace: infra-learning
  labels:
    app: ray-vllm-pd-control-pilot-qwen36-27b
    servingrom.openai/config-id: qwen36-1p2d-d2-full-decode-only-async-control-v1
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ray-vllm-pd-control-pilot-qwen36-27b}
  template:
    metadata:
      labels:
        app: ray-vllm-pd-control-pilot-qwen36-27b
        servingrom.openai/config-id: qwen36-1p2d-d2-full-decode-only-async-control-v1
      annotations:
        huawei.com/Ascend910: Ascend910-10,Ascend910-11,Ascend910-12,Ascend910-13,Ascend910-14,Ascend910-15
        predicate-time: "1"
        servingrom.openai/config-id: qwen36-1p2d-d2-full-decode-only-async-control-v1
    spec:
      schedulerName: default-scheduler
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: a3-server-00
        node.kubernetes.io/npu.chip.name: Ascend910
      containers:
        - name: pd-worker
          image: 110.120.0.3:8889/infra/qwen36-pd-worker:v0.22.1rc1-a3-ray248-servingrom-snapshot-v7
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc", "--"]
          args: ["exec /opt/servingrom/scripts/pd-worker-entrypoint-instrumented.sh"]
          env:
            - {name: SERVINGROM_CONFIG_ID, value: qwen36-1p2d-d2-full-decode-only-async-control-v1}
            - {name: SERVINGROM_TELEMETRY_ENABLED, value: "true"}
            - {name: SERVINGROM_EXPERIMENT_ID, value: servingrom-control-pilot-v1}
            - {name: SERVINGROM_RUN_ID, value: bootstrap-inactive}
            - {name: SERVINGROM_RESULTS_ROOT, value: /servingrom-results}
            - {name: SERVINGROM_RUN_CONTROL_FILE, value: /var/run/qwen36-pd/servingrom-run-control.json}
            - {name: SERVINGROM_RUN_CONTROL_ACK_DIR, value: /var/run/qwen36-pd/servingrom-run-control-acks}
            - {name: SERVINGROM_PROXY_PATH, value: /opt/servingrom-control/pd_proxy.py}
            - {name: SERVINGROM_CONTROL_ENABLED, value: "true"}
            - {name: SERVINGROM_CONTROL_MIN_RHO_A, value: "0.2"}
            - {name: SERVINGROM_CONTROL_MAX_RHO_A, value: "0.8"}
            - {name: SERVINGROM_CONTROL_MAX_STEP, value: "0.2"}
            - {name: SERVINGROM_CONTROL_MIN_DWELL_SECONDS, value: "5"}
            - {name: SERVINGROM_CONTROL_MAX_LOAD_SKEW_TOKENS, value: "2048"}
            - {name: PHYSICAL_IDS, value: "10,11,12,13,14,15"}
            - {name: DECODE_AB_MODE, value: D2}
            - {name: MODEL_PATH, value: /models/Qwen3.6-27B-w8a8}
            - {name: MODEL_NAME, value: qwen36-27b-w8a8}
            - {name: RAY_ADDRESS, value: ray-vllm-lab-head.infra-learning.svc.cluster.local:6379}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: NO_PROXY, value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,110.120.0.3,110.123.0.3,10.0.0.0/8"}
          resources:
            requests: {cpu: "64", memory: 256Gi, huawei.com/Ascend910: "6"}
            limits: {cpu: "64", memory: 256Gi, huawei.com/Ascend910: "6"}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /var/run/qwen36-pd/READY && curl --noproxy '*' -fsS http://127.0.0.1:8080/openapi.json >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          securityContext: {privileged: true}
          volumeMounts:
            - {name: model, mountPath: /models/Qwen3.6-27B-w8a8, readOnly: true}
            - {name: scripts, mountPath: /opt/qwen36-pd, readOnly: true}
            - {name: state, mountPath: /var/run/qwen36-pd}
            - {name: logs, mountPath: /var/log/qwen36-pd}
            - {name: shm, mountPath: /dev/shm}
            - {name: driver, mountPath: /usr/local/Ascend/driver, readOnly: true}
            - {name: dcmi, mountPath: /usr/local/dcmi, readOnly: true}
            - {name: npu-smi, mountPath: /usr/local/bin/npu-smi, readOnly: true}
            - {name: hccn-tool, mountPath: /usr/local/Ascend/driver/tools/hccn_tool, readOnly: true}
            - {name: hccn-conf, mountPath: /etc/hccn.conf, readOnly: true}
            - {name: servingrom-results, mountPath: /servingrom-results}
            - {name: telemetry-hot, mountPath: /opt/servingrom/servingrom_telemetry, readOnly: true}
            - {name: entrypoint-hot, mountPath: /opt/servingrom/scripts/pd-worker-entrypoint-instrumented.sh, subPath: pd-worker-entrypoint-instrumented.sh, readOnly: true}
            - {name: control-code, mountPath: /opt/servingrom-control, readOnly: true}
      volumes:
        - name: model
          hostPath: {path: /home/admin/models/Qwen3.6-27B-w8a8, type: Directory}
        - name: scripts
          configMap: {name: qwen36-pd-control-pilot-scripts, defaultMode: 365}
        - {name: state, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: driver
          hostPath: {path: /usr/local/Ascend/driver}
        - name: dcmi
          hostPath: {path: /usr/local/dcmi}
        - name: npu-smi
          hostPath: {path: /usr/local/bin/npu-smi, type: File}
        - name: hccn-tool
          hostPath: {path: /usr/local/Ascend/driver/tools/hccn_tool, type: File}
        - name: hccn-conf
          hostPath: {path: /etc/hccn.conf, type: File}
        - name: servingrom-results
          hostPath: {path: /home/admin/servingrom-results, type: DirectoryOrCreate}
        - name: telemetry-hot
          configMap: {name: servingrom-telemetry-control-pilot-v1, defaultMode: 365}
        - name: entrypoint-hot
          configMap: {name: servingrom-entrypoint-control-pilot-v1, defaultMode: 365}
        - name: control-code
          configMap:
            name: servingrom-control-pilot-v1-code
            defaultMode: 365
            items:
              - {key: pd_proxy.py, path: pd_proxy.py}
              - {key: package_init.py, path: servingrom_control/__init__.py}
              - {key: manager.py, path: servingrom_control/manager.py}
              - {key: schema.py, path: servingrom_control/schema.py}
              - {key: safety.py, path: servingrom_control/safety.py}
              - {key: state.py, path: servingrom_control/state.py}
              - {key: telemetry.py, path: servingrom_control/telemetry.py}
              - {key: actuators_init.py, path: servingrom_control/actuators/__init__.py}
              - {key: routing_ratio.py, path: servingrom_control/actuators/routing_ratio.py}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-pd-control-pilot
  namespace: infra-learning
spec:
  selector: {app: ray-vllm-pd-control-pilot-qwen36-27b}
  ports:
    - {name: openai, port: 8080, targetPort: 8080}
    - {name: prefill, port: 13700, targetPort: 13700}
    - {name: decode-a, port: 13701, targetPort: 13701}
    - {name: decode-b, port: 13702, targetPort: 13702}
